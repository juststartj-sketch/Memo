<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5a623">
<title>습관</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#222;--sub:#888;--line:#d8d8de;--acc:#f5a623}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--text:#eee;--sub:#999;--line:#3a3a3c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
header a,header button{color:#fff;background:none;border:0;font-size:16px;text-decoration:none;cursor:pointer;padding:4px}
.tabs{flex:1;display:flex;gap:6px}
.tabs a{flex:1;text-align:center;padding:8px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer}
.tabs a.on{background:#fff;color:var(--acc)}
#msg{text-align:center;font-size:13px;color:var(--sub);min-height:18px;padding-top:4px}
.wrap{max-width:700px;margin:auto;padding:0 8px 100px}
.days,.row{display:grid;grid-template-columns:44px 1fr repeat(5,44px);align-items:center}
.days{font-size:11px;color:var(--sub);text-align:center;padding:4px 8px;line-height:1.3}
.row{background:var(--card);border-radius:12px;margin:6px 0;padding:8px}
.name{padding:0 8px;cursor:pointer;min-width:0}
.name b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{color:var(--sub);font-size:12px}
.cell{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:bold;cursor:pointer;user-select:none;line-height:1.1}
.cell.num{font-size:15px}
.cell.num small{font-size:9px;font-weight:normal}
.ring{width:38px;height:38px;color:var(--text)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;border:0;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
.link{display:block;margin:16px auto;background:none;border:0;color:var(--sub);font-size:14px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet h2{margin:0 0 16px;font-size:18px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.freq{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.freq input,.freq select{width:80px !important;text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;cursor:pointer}
.seg button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors span.sel{border-color:var(--text)}
.btns{display:flex;gap:8px;margin-top:20px}
.btns button{flex:1;padding:14px;font-size:16px;border:0;border-radius:10px;cursor:pointer}
.primary{background:var(--acc);color:#fff}
.ghost{background:var(--bg);color:var(--text)}
.danger{background:none;color:#e74c3c;border:0;width:100%;padding:14px;font-size:15px;margin-top:8px;cursor:pointer}
#archRow{display:flex;align-items:center;gap:8px;margin-top:14px}
#setup{max-width:500px;margin:20px auto;padding:16px}
.detail{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;overflow-y:auto}
.detail.on{display:block}
.dhead{position:sticky;top:0;z-index:2;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:8px}
.dhead b{flex:1;font-size:18px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dhead button{color:#fff;background:none;border:0;font-size:16px;cursor:pointer;padding:4px 6px}
.dwrap{max-width:600px;margin:auto;padding:12px 12px 40px}
.statg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px}
.stat small{color:var(--sub);font-size:12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-top:10px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav button{background:none;border:0;font-size:22px;color:var(--text);cursor:pointer;padding:4px 14px}
.mnav button:disabled{opacity:.2;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--sub);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--bg);line-height:1.15;user-select:none}
.cal .d small{font-size:10px;font-weight:bold}
.cal .d.fut{opacity:.3;cursor:default}
.cal .d.today{outline:2px solid var(--acc)}
.rec{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.rec:last-child{border-bottom:0}
</style>
</head>
<body>
<header>
  <div class="tabs"><a onclick="location.replace('index.html')">메모</a><a class="on">습관</a></div>
  <button onclick="resetCfg()">⚙</button>
</header>
<div id="msg"></div>

<div id="setup" style="display:none">
  <h2>습관 API 연결</h2>
  <label>습관 API URL (/exec 로 끝나는 주소)</label>
  <input type="text" id="cUrl" autocomplete="off">
  <label>비밀키</label>
  <input type="password" id="cKey" autocomplete="off">
  <div class="btns"><button class="primary" onclick="connect()">연결</button></div>
</div>

<div id="main" style="display:none">
  <div class="wrap">
    <div class="days" id="days"></div>
    <div id="list"></div>
    <button class="link" id="archBtn" onclick="toggleArch()">보관한 습관 보기</button>
  </div>
  <button class="fab" onclick="openEdit()">+</button>
</div>

<div class="detail" id="detail">
  <div class="dhead">
    <button onclick="history.back()">‹ 목록</button>
    <b id="dName"></b>
    <button onclick="openEdit(detailId)">수정</button>
  </div>
  <div class="dwrap">
    <p id="dFreq" style="text-align:center;color:var(--sub);font-size:13px;margin:0 0 10px"></p>
    <div class="statg" id="dStats"></div>
    <div class="card">
      <div class="mnav"><button onclick="moveMonth(-1)">‹</button><b id="dMonth"></b><button id="dNext" onclick="moveMonth(1)">›</button></div>
      <div class="cal" id="dCal"></div>
    </div>
    <div class="card"><b style="font-size:14px">이 달 기록</b><div id="dRecs"></div></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <h2 id="mTitle">새 습관</h2>
    <div id="typeRow">
      <label>종류</label>
      <div class="seg">
        <button id="tBool" onclick="setType('bool')">예 / 아니오</button>
        <button id="tNum" onclick="setType('num')">숫자 (측정형)</button>
      </div>
    </div>
    <label>이름</label>
    <input type="text" id="hName" maxlength="40" placeholder="예: 스트레칭 / 팔굽혀펴기">

    <div id="boolBox">
      <label>주기</label>
      <div class="freq"><input type="number" id="hDen" min="1" max="31"> 일 동안 <input type="number" id="hNum" min="1" max="31"> 회</div>
      <div class="chips">
        <button onclick="preset(1,1)">매일</button>
        <button onclick="preset(3,7)">주 3회</button>
        <button onclick="preset(5,7)">주 5회</button>
        <button onclick="preset(1,2)">2일마다</button>
        <button onclick="preset(1,7)">주 1회</button>
      </div>
    </div>

    <div id="numBox">
      <label>목표</label>
      <div class="freq">
        <select id="hPer"><option value="1">하루</option><option value="7">일주일</option><option value="30">한 달</option></select>
        <input type="number" id="hTarget" step="any" min="0" placeholder="30">
        <input type="text" id="hUnit" maxlength="10" placeholder="개">
        <select id="hDir"><option value="ge">이상</option><option value="le">이하</option></select>
      </div>
      <label>예: 하루 30개 이상 / 일주일 10km 이상 / 하루 2잔 이하</label>
    </div>

    <label>색상</label>
    <div class="colors" id="colors"></div>
    <div id="archRow"><input type="checkbox" id="hArch"><span>보관 (목록에서 숨기기)</span></div>
    <div class="btns">
      <button class="ghost" onclick="closeModal()">취소</button>
      <button class="primary" onclick="saveHabit()">저장</button>
    </div>
    <button class="danger" id="delBtn" onclick="delHabit()">삭제</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#f5a623','#e74c3c','#3498db','#2ecc71','#9b59b6','#1abc9c','#e67e22','#7f8c8d'];
const WD = '일월화수목금토';
let cfg = JSON.parse(localStorage.getItem('habitCfg') || 'null');
let data = { habits: [], checks: {} }, pending = 0, showArchived = false, editId = null, selColor = COLORS[0], editType = 'bool';
let detailId = null, dMonth = new Date();

const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const parse = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => String(Math.round(Number(v) * 100) / 100);
const msg = t => $('msg').textContent = t;

async function api(action, args) {
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ key: cfg.key, action, args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function load() {
  if (!cfg || pending) return;
  try { const d = await api('load', {}); if (!pending) { data = d; render(); } msg(''); }
  catch (e) { msg('불러오기 실패: ' + e.message); }
}
async function send(action, args) {
  pending++;
  try { const d = await api(action, args); pending--; if (!pending) { data = d; render(); } msg(''); }
  catch (e) { pending--; msg('저장 실패: ' + e.message); load(); }
}

function freqText(h) {
  if (h.type === 'num') {
    const p = { 1: '하루', 7: '주', 30: '월' }[h.den] || h.den + '일';
    return `${p} ${fmt(h.target)}${esc(h.unit || '')} ${h.dir === 'le' ? '이하' : '이상'}`;
  }
  if (h.num === h.den) return '매일';
  if (h.den === 7) return '주 ' + h.num + '회';
  if (h.num === 1) return h.den + '일마다';
  return h.den + '일에 ' + h.num + '회';
}

function stats(h) {
  const ch = data.checks[h.id] || {};
  const today = addDays(new Date(), 0);
  const isNum = h.type === 'num';
  let start = parse(h.created);
  Object.keys(ch).forEach(k => { const d = parse(k); if (d < start) start = d; });
  const mult = Math.pow(0.5, Math.sqrt(isNum ? 1 / h.den : h.num / h.den) / 13);
  const vals = [], ok = [];
  let sum = 0, score = 0, i = 0;
  for (let d = start; d <= today; d = addDays(d, 1), i++) {
    const v = Number(ch[ymd(d)] || 0);
    vals.push(v); sum += v;
    if (i >= h.den) sum -= vals[i - h.den];
    sum = Math.round(sum * 100) / 100;
    let r, good;
    if (!isNum) { r = Math.min(1, sum / h.num); good = sum >= h.num; }
    else if (h.dir === 'le') { good = sum <= h.target; r = good ? 1 : h.target / sum; }
    else { r = Math.min(1, sum / h.target); good = sum >= h.target; }
    score = score * mult + r * (1 - mult);
    ok.push(good);
  }
  let j = ok.length - 1;
  if (j >= 0 && !ok[j]) j--;
  let streak = 0;
  while (j >= 0 && ok[j]) { streak++; j--; }
  let run = 0, best = 0;
  ok.forEach(g => { run = g ? run + 1 : 0; if (run > best) best = run; });
  return { score: Math.round(score * 100), streak, best };
}

function ring(p, c) {
  const r = 15, L = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="4"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${L * p / 100} ${L}" transform="rotate(-90 18 18)"/>
    <text x="18" y="22" text-anchor="middle" font-size="10" fill="currentColor">${p}</text></svg>`;
}

function render() {
  renderDetail();
  const today = new Date();
  const days = [0, 1, 2, 3, 4].map(n => addDays(today, -n));
  $('days').innerHTML = '<div></div><div></div>' +
    days.map(d => `<div>${WD[d.getDay()]}<br>${d.getDate()}</div>`).join('');
  const list = data.habits.filter(h => !!h.archived === showArchived);
  if (!list.length) {
    $('list').innerHTML = `<p class="empty">${showArchived ? '보관한 습관이 없습니다' : '+ 버튼으로 습관을 추가하세요'}</p>`;
    return;
  }
  $('list').innerHTML = list.map(h => {
    const s = stats(h), ch = data.checks[h.id] || {};
    const cells = days.map(d => {
      const k = ymd(d), v = ch[k];
      if (h.type === 'num') {
        const has = v !== undefined;
        return `<div class="cell num" style="color:${has ? h.color : 'var(--line)'}" onclick="enterNum('${h.id}','${k}')">${has ? fmt(v) : '·'}<small>${has ? esc(h.unit || '') : ''}</small></div>`;
      }
      const on = !!v;
      return `<div class="cell" style="color:${on ? h.color : 'var(--line)'}" onclick="setVal('${h.id}','${k}',${on ? 0 : 1})">${on ? '✓' : '✕'}</div>`;
    }).join('');
    return `<div class="row"><div>${ring(s.score, h.color)}</div>
      <div class="name" onclick="openDetail('${h.id}')"><b style="color:${h.color}">${esc(h.name)}</b>
      <small>${freqText(h)} · 연속 ${s.streak}일</small></div>${cells}</div>`;
  }).join('');
}

// ===== 상세 화면 (기록 보기) =====
function openDetail(id) {
  detailId = id;
  const n = new Date();
  dMonth = new Date(n.getFullYear(), n.getMonth(), 1);
  $('detail').classList.add('on');
  $('detail').scrollTop = 0;
  history.pushState({ detail: 1 }, '');
  renderDetail();
}
window.addEventListener('popstate', () => {
  if (!detailId) return;
  detailId = null;
  $('detail').classList.remove('on');
  closeModal();
  render();
});
function moveMonth(n) {
  dMonth = new Date(dMonth.getFullYear(), dMonth.getMonth() + n, 1);
  renderDetail();
}
function dayTap(k) {
  const h = data.habits.find(x => x.id === detailId);
  if (!h) return;
  if (h.type === 'num') enterNum(h.id, k);
  else setVal(h.id, k, (data.checks[h.id] || {})[k] ? 0 : 1);
}
function renderDetail() {
  if (!detailId) return;
  const h = data.habits.find(x => x.id === detailId);
  if (!h) return;
  const ch = data.checks[h.id] || {}, s = stats(h), isNum = h.type === 'num', u = esc(h.unit || '');
  const y = dMonth.getFullYear(), m = dMonth.getMonth(), pre = y + '-' + pad(m + 1);
  const now = new Date(), todayK = ymd(now);
  const keys = Object.keys(ch).filter(k => k.startsWith(pre + '-')).sort().reverse();
  const mSum = keys.reduce((a, k) => a + Number(ch[k]), 0);

  $('dName').textContent = h.name;
  $('dFreq').innerHTML = freqText(h);
  $('dStats').innerHTML = [
    [s.score, '강도'],
    [s.streak + '일', '현재 연속'],
    [s.best + '일', '최고 연속'],
    [isNum ? fmt(mSum) + u : keys.length + '회', '이번 달'],
    [Object.keys(ch).length + '일', '전체 기록일'],
    [h.created.slice(2).replace(/-/g, '.'), '시작일']
  ].map(([v, l]) => `<div class="stat"><b style="color:${h.color}">${v}</b><small>${l}</small></div>`).join('');

  $('dMonth').textContent = `${y}년 ${m + 1}월`;
  $('dNext').disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());

  let html = [...WD].map(w => `<div class="wd">${w}</div>`).join('');
  html += '<div></div>'.repeat(new Date(y, m, 1).getDay());
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const k = pre + '-' + pad(d), v = ch[k], fut = k > todayK;
    let st = '', inner = d;
    if (v !== undefined) {
      if (isNum) { st = `background:${h.color}33;color:${h.color}`; inner = `${d}<small>${fmt(v)}</small>`; }
      else st = `background:${h.color};color:#fff;font-weight:bold`;
    }
    html += `<div class="d${fut ? ' fut' : ''}${k === todayK ? ' today' : ''}" style="${st}" ${fut ? '' : `onclick="dayTap('${k}')"`}>${inner}</div>`;
  }
  $('dCal').innerHTML = html;

  $('dRecs').innerHTML = keys.length ? keys.map(k => {
    const dt = parse(k);
    return `<div class="rec" onclick="dayTap('${k}')"><span>${dt.getMonth() + 1}/${dt.getDate()} (${WD[dt.getDay()]})</span>
      <b style="color:${h.color}">${isNum ? fmt(ch[k]) + u : '✓'}</b></div>`;
  }).join('') : '<p class="empty" style="padding:16px 0">이 달 기록이 없습니다</p>';
}

function setVal(id, date, v) {
  if (!data.checks[id]) data.checks[id] = {};
  if (v > 0) data.checks[id][date] = v; else delete data.checks[id][date];
  render();
  if (navigator.vibrate) navigator.vibrate(15);
  send('toggle', { id, date, value: v });
}
function enterNum(id, date) {
  const h = data.habits.find(x => x.id === id);
  const cur = (data.checks[id] || {})[date];
  const s = prompt(`${h.name} · ${date}\n숫자 입력 (${h.unit || '단위 없음'}) / 지우려면 빈칸`, cur !== undefined ? fmt(cur) : '');
  if (s === null) return;
  const t = s.trim();
  let v = 0;
  if (t !== '') {
    v = parseFloat(t);
    if (isNaN(v) || v < 0) { alert('0 이상의 숫자를 입력하세요'); return; }
    v = Math.round(v * 100) / 100;
  }
  setVal(id, date, v);
}

function drawColors() {
  $('colors').innerHTML = COLORS.map(c =>
    `<span style="background:${c}" class="${c === selColor ? 'sel' : ''}" onclick="selColor='${c}';drawColors()"></span>`).join('');
}
function preset(n, d) { $('hNum').value = n; $('hDen').value = d; }
function setType(t) {
  editType = t;
  $('tBool').classList.toggle('sel', t === 'bool');
  $('tNum').classList.toggle('sel', t === 'num');
  $('boolBox').style.display = t === 'bool' ? 'block' : 'none';
  $('numBox').style.display = t === 'num' ? 'block' : 'none';
}
function openEdit(id) {
  editId = id || null;
  const h = data.habits.find(x => x.id === id) ||
    { name: '', type: 'bool', num: 1, den: 1, target: '', unit: '', dir: 'ge', color: COLORS[0], archived: false };
  const isNum = h.type === 'num';
  $('mTitle').textContent = id ? '습관 수정' : '새 습관';
  $('typeRow').style.display = id ? 'none' : 'block';
  setType(isNum ? 'num' : 'bool');
  $('hName').value = h.name;
  $('hNum').value = isNum ? 1 : h.num;
  $('hDen').value = isNum ? 1 : h.den;
  $('hPer').value = isNum && [1, 7, 30].includes(h.den) ? String(h.den) : '1';
  $('hTarget').value = isNum ? fmt(h.target) : '';
  $('hUnit').value = h.unit || '';
  $('hDir').value = h.dir === 'le' ? 'le' : 'ge';
  selColor = h.color; drawColors();
  $('hArch').checked = !!h.archived;
  $('archRow').style.display = id ? 'flex' : 'none';
  $('delBtn').style.display = id ? 'block' : 'none';
  $('modal').classList.add('on');
  if (!id) setTimeout(() => $('hName').focus(), 100);
}
function closeModal() { $('modal').classList.remove('on'); }
function saveHabit() {
  const name = $('hName').value.trim();
  if (!name) { alert('이름을 입력하세요'); return; }
  const old = data.habits.find(x => x.id === editId) || {};
  const habit = { ...old, id: editId, name, type: editType, color: selColor, archived: $('hArch').checked };
  if (editType === 'num') {
    const target = parseFloat($('hTarget').value);
    if (!(target > 0)) { alert('목표 숫자를 입력하세요'); return; }
    Object.assign(habit, { num: 1, den: parseInt($('hPer').value), target, unit: $('hUnit').value.trim(), dir: $('hDir').value });
  } else {
    const num = parseInt($('hNum').value) || 1, den = parseInt($('hDen').value) || 1;
    if (num > den) { alert('횟수가 기간(일)보다 클 수 없습니다'); return; }
    Object.assign(habit, { num, den });
  }
  closeModal(); msg('저장 중…');
  send('saveHabit', { habit });
}
function delHabit() {
  const h = data.habits.find(x => x.id === editId);
  if (!h || !confirm(`"${h.name}" 습관과 기록을 모두 삭제할까요?`)) return;
  const id = editId;
  data.habits = data.habits.filter(x => x.id !== id);
  closeModal();
  if (detailId) history.back(); else render();
  send('deleteHabit', { id });
}
function toggleArch() {
  showArchived = !showArchived;
  $('archBtn').textContent = showArchived ? '진행 중 습관 보기' : '보관한 습관 보기';
  render();
}

async function connect() {
  const url = $('cUrl').value.trim(), key = $('cKey').value.trim();
  if (!url.endsWith('/exec')) { alert('주소는 /exec 로 끝나야 합니다'); return; }
  cfg = { url, key }; msg('연결 중…');
  try { data = await api('load', {}); localStorage.setItem('habitCfg', JSON.stringify(cfg)); msg(''); show(); }
  catch (e) { cfg = null; msg('연결 실패: ' + e.message); }
}
function resetCfg() {
  if (!confirm('연결 정보를 지우고 다시 입력할까요? (습관 기록은 지워지지 않습니다)')) return;
  localStorage.removeItem('habitCfg'); cfg = null; show();
}
function show() {
  $('setup').style.display = cfg ? 'none' : 'block';
  $('main').style.display = cfg ? 'block' : 'none';
  if (cfg) render();
}

show(); load();
setInterval(load, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); load(); } });
</script>
</body>
</html>
